name: Validate travel site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate itinerary and website assets
        run: node scripts/validate-cloud.mjs
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check overview-map.js
          node --check route-ui.js
          node --check runtime-storage.js
